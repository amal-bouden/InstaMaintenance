<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="220" height="80">
  <!-- Oval border -->
  <ellipse cx="110" cy="40" rx="105" ry="36" fill="white" stroke="#0072BC" stroke-width="2.5"/>
  <!-- Blue left arc accent -->
  <path d="M 10 40 Q 12 15 35 25" stroke="#0072BC" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- "conso" text in blue -->
  <text x="22" y="47" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#0072BC" letter-spacing="-1">conso</text>
  <!-- "med" text in red -->
  <text x="111" y="47" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#ED1C24" letter-spacing="-0.5">med</text>
  <!-- ® symbol -->
  <text x="165" y="35" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#0072BC">®</text>
  <!-- Tagline -->
  <text x="110" y="62" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555555" text-anchor="middle" letter-spacing="0.5">Consommables Médicaux</text>
</svg>
